services:
  db:
    image: postgres:16-alpine
    container_name: janseva-ai-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: janseva
      POSTGRES_PASSWORD: janseva_password_2026
      POSTGRES_DB: janseva_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janseva -d janseva_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: janseva-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=JanSeva AI
      - VERSION=1.0.0
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://janseva:janseva_password_2026@db:5432/janseva_db
      - SECRET_KEY=JANSEVA_AI_PRODUCTION_SECRET_KEY_MPONLINE_2026
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000"]
      - UPLOAD_DIR=/app/uploads
      - STORAGE_TYPE=local
      - EMAIL_PROVIDER=mock
      - GEMINI_API_KEY=
      - GEMINI_MODEL=gemini-1.5-flash
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    container_name: janseva-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  backend-uploads:
